name: Extension checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            figma-zh-ui/package-lock.json
            github-zh-ui/package-lock.json
      - name: Install Figma test dependencies
        run: npm ci --prefix figma-zh-ui
      - name: Install GitHub test dependencies
        run: npm ci --prefix github-zh-ui
      - name: Test both extensions, static policies and memory
        run: npm run check
